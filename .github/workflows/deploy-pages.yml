name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/generedge-professional-site-tlrsef
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        run: git push --force origin HEAD:refs/heads/gh-pages
